<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen – Chai Tapri Café</title>
<style>
:root{--brand:#c8102e;--ink:#2a1515;--line:#f1d5d8;--muted:#76605f}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#fff;color:var(--ink);padding:16px;max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.5rem;color:var(--brand)}
.pill{padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;background:#eee}
.pill.on{background:#d9f5e0;color:#146c2e}
button{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--brand);background:#fff;color:var(--brand);padding:10px 18px;cursor:pointer}
button.fill{background:var(--brand);color:#fff}
#start{position:fixed;inset:0;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;z-index:5}
#start button{background:#fff;color:var(--brand);font-size:1.2rem;padding:16px 32px;border:0}
#list{display:grid;gap:14px}
.card{border:2px solid var(--line);border-radius:16px;padding:16px}
.card.new{border-color:var(--brand);background:#fff4f5}
.top{display:flex;justify-content:space-between;align-items:baseline}
.tbl{font-size:2rem;font-weight:800;color:var(--brand)}
.time{color:var(--muted);font-size:.9rem}
.items{margin:10px 0;font-size:1.2rem;line-height:1.7}
.note{background:#fff0c9;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.err{background:#fde3e6;color:#8f0a20;padding:12px;border-radius:12px;margin-bottom:12px;font-weight:600}
</style>
</head>
<body>

<div id="start">
  <h1 style="color:#fff">Kitchen screen</h1>
  <p>Order aane par awaaz ke liye neeche button ek baar dabao.<br>Is phone ki volume badha ke rakho.</p>
  <button id="go">Shuru karo</button>
</div>

<header>
  <h1>Kitchen orders</h1>
  <div>
    <span class="pill" id="live">Connecting…</span>
    <button id="test">Awaaz test</button>
  </div>
</header>
<div id="err"></div>
<div id="list"><p class="empty">Naya order aate hi yahan dikhega.</p></div>

<script>
/* Ye hissa alag hai, taaki Shuru button hamesha chale */
window.speak = function(text){
  if(!("speechSynthesis" in window)){ alert("Is browser me awaaz ki suvidha nahi hai. Chrome me kholo."); return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "hi-IN"; u.rate = 0.95; u.volume = 1;
  var v = speechSynthesis.getVoices().find(function(v){ return v.lang && v.lang.toLowerCase().indexOf("hi")===0; });
  if(v) u.voice = v;
  speechSynthesis.speak(u);
};
document.getElementById("go").onclick = function(){ window.speak("Kitchen shuru ho gaya."); document.getElementById("start").hidden = true; };
document.getElementById("test").onclick = function(){ window.speak("Table 4 par 2 chai, 2 poha ka order aaya hai."); };
setTimeout(function(){
  if(!window.__ready){
    document.getElementById("live").textContent = "Offline";
    document.getElementById("err").innerHTML = '<div class="err">Database load nahi hua. Ye page file ki tarah nahi, internet par hosted link se kholo, aur internet on rakho.</div>';
  }
}, 4000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnJ64cQjrzze4U9g1HYI3rYV8LRqxxum4",
  authDomain: "cafe-demo-dfc2c.firebaseapp.com",
  projectId: "cafe-demo-dfc2c",
  storageBucket: "cafe-demo-dfc2c.firebasestorage.app",
  messagingSenderId: "1020470351323",
  appId: "1:1020470351323:web:485e01607ca7ca1f36c3fe"
};
const db = getFirestore(initializeApp(firebaseConfig));
window.__ready = true;

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Awaaz ---------- */
function announce(o){
  const parts = o.items.map(i=>`${i.qty} ${i.name}`).join(", ");
  const text = `Table ${o.table} par ${parts} ka order aaya hai.`;
  window.speak(text);
}
/* ---------- Orders ---------- */
const orders = {};
let first = true;
const q = query(collection(db,"orders"), orderBy("createdAt","desc"), limit(50));
onSnapshot(q, snap=>{
  $("live").textContent = "Live"; $("live").className = "pill on"; $("err").innerHTML = "";
  snap.docChanges().forEach(c=>{
    const o = c.doc.data(); o.id = c.doc.id;
    if(c.type==="removed") delete orders[o.id]; else orders[o.id] = o;
    if(!first && c.type==="added" && o.status==="new") announce(o);
  });
  first = false;
  draw();
}, err=>{
  console.error(err);
  $("live").textContent = "Offline"; $("live").className = "pill";
  $("err").innerHTML = '<div class="err">Database se connect nahi ho paya. Internet aur Firestore rules check karo.</div>';
});

function draw(){
  const rows = Object.values(orders).filter(o=>o.status!=="done")
    .sort((a,b)=>(a.createdAt?.seconds||9e9)-(b.createdAt?.seconds||9e9));
  if(!rows.length){ $("list").innerHTML = '<p class="empty">Naya order aate hi yahan dikhega.</p>'; return; }
  $("list").innerHTML = rows.map(o=>{
    const t = o.createdAt ? o.createdAt.toDate().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) : "abhi";
    const items = o.items.map(i=>`<div>${i.qty} × ${esc(i.name)}</div>`).join("");
    const label = {new:"Naya", preparing:"Ban raha hai", ready:"Ready"}[o.status] || o.status;
    let acts = "";
    if(o.status==="new") acts += `<button class="fill" data-id="${o.id}" data-s="preparing">Confirm karo</button>`;
    if(o.status==="preparing") acts += `<button class="fill" data-id="${o.id}" data-s="ready">Ready hai</button>`;
    if(o.status==="ready") acts += `<button class="fill" data-id="${o.id}" data-s="done">Serve ho gaya</button>`;
    acts += `<button data-say="${o.id}">Dobara bolo</button>`;
    return `<div class="card ${o.status}"><div class="top"><span class="tbl">Table ${esc(o.table)}</span><span class="time">${label} · ${t}</span></div>
      <div class="items">${items}</div>
      ${o.note ? `<div class="note">Note: ${esc(o.note)}</div>` : ""}
      ${o.name ? `<div class="time" style="margin-bottom:8px">Naam: ${esc(o.name)}</div>` : ""}
      <div class="acts">${acts}</div></div>`;
  }).join("");
  document.querySelectorAll("button[data-s]").forEach(b=>{
    b.onclick = ()=> updateDoc(doc(db,"orders",b.dataset.id), {status:b.dataset.s}).catch(e=>alert("Update nahi hua: "+e.message));
  });
  document.querySelectorAll("button[data-say]").forEach(b=>{
    b.onclick = ()=> announce(orders[b.dataset.say]);
  });
}
</script>
</body>
</html>
